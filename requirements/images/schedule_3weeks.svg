<svg viewBox="0 0 760 268" role="img" aria-label="2주차 끝에 상황 경로와 설명이 휴대폰에서 돌아야 한다" font-size="12" xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo, sans-serif"><defs><marker id="plan-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c8c8c"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">2주차 끝에 상황 경로와 설명이 휴대폰에서 돌아야 한다</text><g data-claude-anchor="connectors" fill="none" stroke="#8c8c8c" stroke-width="1.25"><path d="M240 80H272" marker-end="url(#plan-arrow)"></path><path d="M488 80H520" marker-end="url(#plan-arrow)"></path></g><g data-claude-anchor="week-1"><g><rect x="24" y="60" width="216" height="184" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><line x1="36" y1="100" x2="228" y2="100" stroke="#e3e3e3"></line><line x1="36" y1="206" x2="228" y2="206" stroke="#e3e3e3"></line><path d="M42 219l6 6l-6 6l-6 -6z" fill="#8c8c8c"></path></g><text data-claude-text-id="w1-name" x="36" y="86" font-size="13" font-weight="600" fill="#1f1f1f">1주차 · 데이터와 도로망</text><text data-claude-text-id="w1-a" x="36" y="124" fill="#1f1f1f">전국 시설 적재 마무리</text><text data-claude-text-id="w1-b" x="36" y="144" fill="#1f1f1f">OSM → 길·교차점 표</text><text data-claude-text-id="w1-c" x="36" y="164" fill="#1f1f1f">시설을 길에 붙여 감점 계산</text><text data-claude-text-id="w1-d" x="36" y="184" fill="#1f1f1f">최단 경로 API</text><text data-claude-text-id="w1-gate" x="56" y="229" font-size="11.5" fill="#5c5c5c">문화전당 최단 경로가 지도에</text></g><g data-claude-anchor="week-2"><g><rect x="272" y="60" width="216" height="184" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"></rect><line x1="284" y1="100" x2="476" y2="100" stroke="#e3e3e3"></line><line x1="284" y1="206" x2="476" y2="206" stroke="#e3e3e3"></line><path d="M290 219l6 6l-6 6l-6 -6z" fill="#2f6fd6"></path></g><text data-claude-text-id="w2-name" x="284" y="86" font-size="13" font-weight="600" fill="#1f1f1f">2주차 · 상황 경로와 화면</text><text data-claude-text-id="w2-a" x="284" y="124" fill="#1f1f1f">일몰로 밤 판단 (날씨는 보류)</text><text data-claude-text-id="w2-b" x="284" y="144" fill="#1f1f1f">가중치 경로, 1.3배 규칙</text><text data-claude-text-id="w2-c" x="284" y="164" fill="#1f1f1f">두 경로 차이 설명문</text><text data-claude-text-id="w2-d" x="284" y="184" fill="#1f1f1f">안드로이드 앱 + 카카오맵</text><text data-claude-text-id="w2-gate" x="304" y="229" font-size="11.5" font-weight="600" fill="#1f1f1f">밤 경로가 폰에서 동작</text></g><g data-claude-anchor="week-3"><g><rect x="520" y="60" width="216" height="184" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><line x1="532" y1="100" x2="724" y2="100" stroke="#e3e3e3"></line><line x1="532" y1="206" x2="724" y2="206" stroke="#e3e3e3"></line><path d="M538 219l6 6l-6 6l-6 -6z" fill="#8c8c8c"></path></g><text data-claude-text-id="w3-name" x="532" y="86" font-size="13" font-weight="600" fill="#1f1f1f">3주차 · 추가 기능과 평가</text><text data-claude-text-id="w3-a" x="532" y="124" fill="#1f1f1f">걷는 동안 안내 (2차)</text><text data-claude-text-id="w3-b" x="532" y="144" fill="#1f1f1f">30쌍 평가와 가중치 조정</text><text data-claude-text-id="w3-c" x="532" y="164" fill="#1f1f1f">TMAP 도보 경로와 비교</text><text data-claude-text-id="w3-d" x="532" y="184" fill="#1f1f1f">발표 자료</text><text data-claude-text-id="w3-gate" x="552" y="229" font-size="11.5" fill="#5c5c5c">평가표와 시연 준비 끝</text></g><text data-claude-text-id="legend" x="24" y="264" font-size="11.5" fill="#5c5c5c">◆ = 그 주를 끝내는 기준</text></svg>