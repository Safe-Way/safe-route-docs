<svg viewBox="0 0 760 408" role="img" aria-label="준비는 한 번, 경로 요청은 주변 범위만 읽어 계산한다" font-size="13" xmlns="http://www.w3.org/2000/svg" font-family="Apple SD Gothic Neo, sans-serif"><defs><marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8c8c8c"></path></marker></defs><text data-claude-text-id="title" x="24" y="28" font-size="15" font-weight="600" fill="#1f1f1f">준비는 한 번, 경로 요청은 주변 범위만 읽어 계산한다</text><text data-claude-text-id="lane-prep" x="24" y="60" font-size="11.5" fill="#5c5c5c">준비 · 데이터를 갱신할 때 한 번</text><text data-claude-text-id="lane-request" x="24" y="300" font-size="11.5" fill="#5c5c5c">요청 · 경로를 찾을 때마다</text><g data-claude-anchor="connectors" fill="none" stroke="#8c8c8c" stroke-width="1.25"><path d="M240 108H272" marker-end="url(#arch-arrow)"></path><path d="M488 108H520" marker-end="url(#arch-arrow)"></path><path d="M628 144V192" marker-end="url(#arch-arrow)"></path><path d="M240 348H272" marker-start="url(#arch-arrow)" marker-end="url(#arch-arrow)"></path><path d="M488 348H520" marker-end="url(#arch-arrow)"></path><path d="M380 312V264" marker-end="url(#arch-arrow)"></path></g><text data-claude-text-id="edge-load" x="636" y="172" font-size="11.5" fill="#5c5c5c">적재</text><text data-claude-text-id="edge-read" x="388" y="292" font-size="11.5" fill="#5c5c5c">주변 길·시설만 읽기</text><g data-claude-anchor="box-sources"><rect x="24" y="72" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><text data-claude-text-id="src-name" x="36" y="96" font-weight="600" fill="#1f1f1f">외부 시설 데이터</text><text data-claude-text-id="src-l1" x="36" y="116" font-size="11.5" fill="#5c5c5c">재난안전·생활안전지도 API</text><text data-claude-text-id="src-l2" x="36" y="132" font-size="11.5" fill="#5c5c5c">공공데이터포털 · CCTV 파일 · OSM</text></g><g data-claude-anchor="box-download"><rect x="272" y="72" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><text data-claude-text-id="dl-name" x="284" y="96" font-weight="600" fill="#1f1f1f">내려받기</text><text data-claude-text-id="dl-l1" x="284" y="116" font-size="11.5" fill="#5c5c5c">download_national.py</text><text data-claude-text-id="dl-l2" x="284" y="132" font-size="11.5" fill="#5c5c5c">하루 한도 안에서 이어 받기</text></g><g data-claude-anchor="box-import"><rect x="520" y="72" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><text data-claude-text-id="im-name" x="532" y="96" font-weight="600" fill="#1f1f1f">적재·정제·원값 계산</text><text data-claude-text-id="im-l1" x="532" y="116" font-size="11.5" fill="#5c5c5c">시설 13종 → 정제 시설 표 poi</text><text data-claude-text-id="im-l2" x="532" y="132" font-size="11.5" fill="#5c5c5c">길마다 원값 미리 계산</text></g><g data-claude-anchor="box-mysql"><rect x="272" y="192" width="464" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><text data-claude-text-id="db-name" x="284" y="216" font-weight="600" fill="#1f1f1f">MySQL 8.0 (학교 서버)</text><text data-claude-text-id="db-l1" x="284" y="236" font-size="11.5" fill="#5c5c5c">poi · road_node · road_edge · edge_stat · edge_poi · 대중교통 표</text><text data-claude-text-id="db-l2" x="284" y="252" font-size="11.5" fill="#5c5c5c">광주 전체 길 81,847개 · 공간 인덱스로 범위 검색</text></g><g data-claude-anchor="box-browser"><rect x="24" y="312" width="216" height="72" rx="8" fill="none" fill-opacity="1" stroke="#8c8c8c" stroke-width="1.25"></rect><text data-claude-text-id="br-name" x="36" y="336" font-weight="600" fill="#1f1f1f">안드로이드 앱</text><text data-claude-text-id="br-l1" x="36" y="356" font-size="11.5" fill="#5c5c5c">Android Studio · 카카오맵 SDK</text><text data-claude-text-id="br-l2" x="36" y="372" font-size="11.5" fill="#5c5c5c">검색, 두 경로 표시, 차이 설명</text></g><g data-claude-anchor="box-api"><rect x="272" y="312" width="216" height="72" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-